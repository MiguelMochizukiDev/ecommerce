# ==========================================
# BANCO DE DADOS
# ==========================================

# Endereço do MySQL rodando localmente
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

# Usuário e senha do seu MySQL local
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver de conexão
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Para desenvolvimento, usamos "update"
# Em produção, é recomendado usar "validate" ou "none"
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL no terminal (ótimo para aprendizado)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVIDOR
# ==========================================
server.port=8080

# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000